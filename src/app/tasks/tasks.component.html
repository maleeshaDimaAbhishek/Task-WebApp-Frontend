<section class="tasks">
  <header class="tasks-header">
    <div>
      <p class="eyebrow">Task Center</p>
      <h2>My Tasks</h2>
    </div>
    <button type="button">+ New Task</button>
  </header>

  <div class="task-list">
    <article class="task-row">
      <h3>Prepare sprint summary</h3>
      <p>Collect updates from contributors and draft sprint notes.</p>
      <span class="pill high">High</span>
    </article>

    <article class="task-row">
      <h3>Review onboarding copy</h3>
      <p>Polish welcome messages and first-time user flow text.</p>
      <span class="pill medium">Medium</span>
    </article>

    <article class="task-row">
      <h3>Archive resolved bugs</h3>
      <p>Close stale tickets and update ownership labels.</p>
      <span class="pill low">Low</span>
    </article>
  </div>
</section>
