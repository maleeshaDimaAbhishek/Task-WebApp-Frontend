<div class="login-wrapper">
  <form class="login-panel" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2>Sign in</h2>
    <p class="subtitle">Use your account to access your task workspace.</p>

    <div class="field">
      <label>Username</label>
      <input type="text" formControlName="username" placeholder="Enter your username" />
      <span class="error" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        Username is required
      </span>
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Enter your password" />
      <span class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        Password is required
      </span>
    </div>

    <div class="error-box" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button class="submit-btn" type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Signing in...' : 'Sign in' }}
    </button>

    <p class="account-hint">
      Don't have an account?
      <a routerLink="/register">Create one</a>
    </p>
  </form>
</div>
